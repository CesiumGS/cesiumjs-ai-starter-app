site_name: CesiumJS AI Starter App
site_description: A ready-to-run starter pairing CesiumJS with an LLM-powered chat interface.
site_url: https://cesiumgs.github.io/cesiumjs-ai-starter-app/
repo_url: https://github.com/CesiumGS/cesiumjs-ai-starter-app
repo_name: CesiumGS/cesiumjs-ai-starter-app

docs_dir: docs

not_in_nav: |
  README.md

theme:
  name: material
  logo: assets/cesium-favicon.ico
  favicon: assets/cesium-favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - include-markdown

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
      - Overview: architectures/architecture.md
      - Codegen Architecture: architectures/architecture-codegen.md
      - Codegen Security: architectures/codegen-tool-security-attacks-vectors.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Cesium Viewer Tools Tutorial: tutorials/cesium-viewer-tools-tutorial.md
      - Codegen Tool Tutorial: tutorials/codegen-tool-tutorial.md
      - How Codegen Works: tutorials/codegen-pipeline.md
  - Packages:
      - Overview: packages/index.md
      - cesium-ai/codegen-cesium: packages/codegen-cesium/index.md
      - cesium-ai/tools-schemas:
          - Overview: packages/tools-schemas/index.md
          - Tool Catalogue: packages/tools-schemas/tools.md
      - cesium-ai/server: packages/server/index.md
      - cesium-ai/chat-element: packages/chat-element/index.md
      - cesium-ai/sample-config: packages/sample-config/index.md
      - cesiumjs-ai-sample-backend: packages/backend.md
      - cesiumjs-ai-sample-frontend: packages/frontend.md
