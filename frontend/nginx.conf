server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Reverse-proxy chat API calls to the backend over the internal Docker
    # network. The backend's own port is never published externally — this is
    # the only path to it.
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/chat streams via SSE — disable buffering so chunks flush promptly.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed, immutable build assets (Vite fingerprints filenames) — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CesiumJS static assets copied in by vite-plugin-static-copy.
    location /cesium/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — unknown routes resolve to index.html client-side.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
