<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sandbox Proxy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <script>
      // Sandbox proxy for MCP Apps (see https://mcpui.dev/guide/client/walkthrough#_3-set-up-a-sandbox-proxy).
      // Runs in its own iframe, one level between AppRenderer (the chat panel)
      // and the actual widget HTML it writes into this document — this
      // double-iframe layout is what gives the widget its sandboxed isolation.
      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (data.method === "ui/notifications/sandbox-resource-ready") {
          const { html } = data.params || {};
          if (html) {
            document.open();
            document.write(html);
            document.close();
          }
        }
      });

      window.parent.postMessage(
        {
          method: "ui/notifications/sandbox-proxy-ready",
          params: {},
        },
        "*",
      );
    </script>
  </body>
</html>
