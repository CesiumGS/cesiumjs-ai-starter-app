<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="title desc">
  <title id="title">CesiumJS AI Starter App architecture</title>
  <desc id="desc">Abstract diagram showing a browser frontend (CesiumJS globe and chat panel) communicating with a Node.js backend, which relays tool definitions and prompts to an LLM. An optional MCP server box connects to the backend.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5276"/>
    </marker>

    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <!-- ───────────────────────── Frontend (Browser) ───────────────────────── -->
  <g>
    <rect x="40" y="60" width="260" height="330" rx="18" fill="#ffffff" stroke="#2e86c1" stroke-width="2.5"/>
    <text x="170" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a5276">Frontend</text>
    <text x="170" y="117" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5d6d7e">Browser (Vite + React)</text>

    <!-- Globe icon (Cesium logo) -->
    <g transform="translate(112,147) scale(4.8333)"><path fill="#2e86c1" d="M12 2c5.523 0 10 4.477 10 10s-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2Zm8.754 8.96a1 1 0 0 0-1.37-.041l-.074.074-3.282 3.58a2.001 2.001 0 0 1-2.858.093l-.152-.164-2.803-3.363a1.001 1.001 0 0 0-1.506-.037l-3.234 3.53c-.495.54-1.211.74-1.872.606A9.001 9.001 0 0 0 21 12c0-.281-.016-.56-.041-.834l-.205-.205ZM12 3a9 9 0 0 0-8.8 10.887l.063.07a1 1 0 0 0 1.474 0l3.235-3.53a2 2 0 0 1 3.01.071l2.803 3.363.077.082a1 1 0 0 0 1.429-.045l3.282-3.58.15-.15a2.002 2.002 0 0 1 2.002-.38C19.738 5.886 16.207 3 12 3Zm4 4a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></g>
    <text x="170" y="282" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a5276">CesiumJS Viewer</text>

    <!-- Chat panel icon -->
    <rect x="95" y="305" width="150" height="60" rx="10" fill="#eaf6fc" stroke="#48c9f0" stroke-width="1.5"/>
    <rect x="108" y="317" width="70" height="10" rx="5" fill="#48c9f0"/>
    <rect x="108" y="333" width="100" height="10" rx="5" fill="#2e86c1"/>
    <text x="170" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a5276">Chat Panel</text>
  </g>

  <!-- ───────────────────────── Backend ───────────────────────── -->
  <g>
    <rect x="370" y="60" width="260" height="330" rx="18" fill="#ffffff" stroke="#2e86c1" stroke-width="2.5"/>
    <text x="500" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a5276">Backend</text>
    <text x="500" y="117" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5d6d7e">Node.js / Express</text>

    <rect x="410" y="145" width="180" height="50" rx="10" fill="#eaf6fc" stroke="#2e86c1" stroke-width="1.5"/>
    <text x="500" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a5276">Agent Loop</text>

    <rect x="410" y="210" width="180" height="50" rx="10" fill="#eaf6fc" stroke="#2e86c1" stroke-width="1.5"/>
    <text x="500" y="241" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a5276">Tool Registry</text>

    <rect x="410" y="275" width="180" height="50" rx="10" fill="#eaf6fc" stroke="#2e86c1" stroke-width="1.5"/>
    <text x="500" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1a5276">Codegen Verifier</text>

    <rect x="410" y="340" width="180" height="34" rx="17" fill="#1a5276"/>
    <text x="500" y="362" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">🔒 API key stays here</text>
  </g>

  <!-- ───────────────────────── LLM ───────────────────────── -->
  <g>
    <rect x="700" y="140" width="260" height="170" rx="18" fill="#ffffff" stroke="#48c9f0" stroke-width="2.5"/>
    <text x="830" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a5276">LLM</text>
    <text x="830" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5d6d7e">Language model provider</text>

    <circle cx="830" cy="250" r="34" fill="#48c9f0" opacity="0.25"/>
    <circle cx="830" cy="250" r="22" fill="#48c9f0"/>
    <circle cx="830" cy="250" r="9" fill="#ffffff"/>

    <text x="830" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5d6d7e">Structured tool calls</text>
  </g>

  <!-- ───────────────────────── Optional MCP servers ───────────────────────── -->
  <g>
    <rect x="700" y="350" width="260" height="90" rx="18" fill="#ffffff" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="830" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#5d6d7e">MCP Servers</text>
    <text x="830" y="404" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7f8c8d">Optional external tools/data</text>
  </g>

  <!-- ───────────────────────── Connections ───────────────────────── -->
  <!-- Frontend <-> Backend -->
  <line x1="300" y1="205" x2="370" y2="205" stroke="#1a5276" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="335" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5d6d7e">tool calls</text>

  <!-- Backend <-> LLM -->
  <line x1="630" y1="220" x2="700" y2="220" stroke="#1a5276" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="665" y="207" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a5276">prompts</text>
  <text x="665" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5d6d7e">tool</text>
  <text x="665" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5d6d7e">definitions</text>

  <!-- Backend <-> MCP (dashed, optional) -->
  <line x1="630" y1="360" x2="700" y2="380" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowLight)"/>
</svg>
